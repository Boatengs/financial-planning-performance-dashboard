name: Historical Network Data Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-data-build.yml"
      - "pipeline/network_history.py"
      - "pipeline/t100.py"
      - "pipeline/transtats.py"
      - "pipeline/airports.py"
      - "pipeline/dimensions.py"
      - "scripts/build_network_history.py"
      - "scripts/validate_network_history.py"
      - "scripts/download_official_sources.py"
      - "scripts/download_t100_history.py"

permissions:
  contents: read

concurrency:
  group: historical-network-data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run code checks
        run: make check

      - name: Download FAA reference data
        run: python scripts/download_official_sources.py --group network --retries 5

      - name: Download T-100 annual extracts from TranStats
        run: >-
          python scripts/download_t100_history.py
          --years 2019 2020 2021 2022 2023 2024 2025 2026
          --retries 3

      - name: Build historical network model
        run: python scripts/build_network_history.py

      - name: Validate historical network model
        run: python scripts/validate_network_history.py

      - name: Upload validated network outputs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: delta-network-history-${{ github.sha }}
          path: |
            processed/fact_route_aircraft_monthly.csv
            processed/fact_route_monthly.csv
            processed/fact_network_kpi_monthly.csv
            processed/dim_airport.csv
            processed/dim_route.csv
            processed/dim_date.csv
            processed/network_source_manifest.csv
            processed/network_history_summary.json
            processed/network_history_validation.json
            raw/t100_history_download_manifest.csv
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload acquisition diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: historical-network-diagnostics-${{ github.sha }}
          path: |
            raw/t100_history_download_manifest.csv
            processed/network_source_manifest.csv
            processed/network_history_summary.json
            processed/network_history_validation.json
          if-no-files-found: warn
          retention-days: 14
